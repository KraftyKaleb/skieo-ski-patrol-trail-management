[Mod]
Version = 1
Id = ski-patrol
Release = 0.3.2
GameVersion = CL8198
Name = Ski Patrol
Description = Closes and reopens runs automatically: avalanche danger on steep runs, blizzards, thin snow cover, grooming and extreme cold. Runs you close yourself are never touched.
Usage = The patrol works by itself on every resort. Click a run and open its Edit tab to see why the patrol closed it and when it may reopen; Reopen anyway leaves it open for a day. Press F9 for a patrol report in the UE4SS log and Ctrl+F9 to pause or resume the patrol. You can also switch the mod on or off in the Mods menu.
ManagedKeybinds = true

[Keybinds]
Write patrol report = F9
Pause or resume patrol = Ctrl+F9
