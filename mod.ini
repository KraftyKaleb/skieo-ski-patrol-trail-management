[Mod]
Version = 1
Id = ski-patrol-trail-management
Release = 0.1.0
GameVersion = CL8198
Name = Ski Patrol Trail Management
Description = Closes and reopens runs automatically: avalanche danger on steep runs, blizzards, thin snow cover, grooming and extreme cold. Runs you close yourself are never touched.
Usage = Everything is off until you switch it on. Click a run, open its Edit tab and use the Ski patrol section: one switch per condition (avalanche, blizzard, thin snow, grooming, cold) says whether the patrol may close that run. The game's own Open/Closed switch opens or closes the run as usual; reopening a patrol closure leaves it open for a day. F9 writes a patrol report, Ctrl+F9 pauses or resumes the patrol.
ManagedKeybinds = true

[Keybinds]
Write patrol report = F9
Pause or resume patrol = Ctrl+F9
